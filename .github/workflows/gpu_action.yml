name: GPU compilation

on: [pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  gpu-compilation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Get submodules
        run: |
          git submodule update --init
          cd external/Microphysics
          git fetch; git checkout development
          cd ../amrex
          git fetch; git checkout development
          cd ../..

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get -qq -y install curl g++

      - name: Install CUDA
        run: .github/workflows/dependencies/dependencies_nvcc.sh 12.9

      - name: Compile reacting_bubble for GPU
        run: |
          export PATH=$PATH:/usr/local/cuda/bin
          cd Exec/test_problems/reacting_bubble
          make DIM=2 USE_MPI=FALSE USE_CUDA=TRUE -j 4
